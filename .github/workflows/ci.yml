name: ci

on:
  push:
    branches: [main, develop, dagim-feature]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure dev dependencies (including ruff) are installed
          pip install .[dev]

      - name: Run Ruff Linter & Formatter Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker:
          - surface-worker
          - deep-worker
          - dark-worker
          - parser-worker
          - llm-worker
          - exporter-worker
          - scrapy_worker
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.worker }}
        run: |
          docker build \
            -f workers/Dockerfile \
            --build-arg WORKER_MODULE=${{ matrix.worker }} \
            -t duka-${{ matrix.worker }}:ci \
            ./workers

  ui-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
