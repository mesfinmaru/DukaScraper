networks:
  duka-net:
    driver: bridge
volumes:
  postgres_data: null
  es_data: null
  clickhouse_data: null
  minio_data: null
  kafka_data: null
  pgadmin_data: null
  qdrant_data: null
  ollama_data: null
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-duka_system}
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/postgres:/docker-entrypoint-initdb.d
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d duka_system
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
    - 5050:80
    volumes:
    - pgadmin_data:/var/lib/pgadmin
    - ./pgadmin_servers.json:/pgadmin4/servers.json
    networks:
    - duka-net
    restart: always
    depends_on:
    - postgres
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
    - 9092:9092
    - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-topics-init; auto-creation hides
      # typos in topic names and lets producers silently create mis-partitioned
      # topics, so it is disabled.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
    - kafka_data:/var/lib/kafka/data
    networks:
    - duka-net
    restart: always
    healthcheck:
      # Real broker probe: confirms the broker accepts API requests (the old
      # 'test -f /proc/1/status' check always passed and proved nothing).
      test:
      - CMD-SHELL
      # Probe the PLAINTEXT listener address (kafka:9092) — the broker binds
      # that hostname, not loopback, so localhost would never answer.
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  kafka-topics-init:
    image: apache/kafka:3.9.1
    container_name: kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - -c
    command:
    - '/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic crawl.requests --partitions 10 --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic crawl.raw --partitions 10 --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic crawl.parsed --partitions 10 --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic search.requests --partitions 5 --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic audio.requests --partitions 3 --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic crawl.requests.dlq --partitions 5 --replication-factor 1

      echo "Kafka topics initialized successfully."

      '
    networks:
    - duka-net
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
    - 8088:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
    - duka-net
    restart: always
    depends_on:
    - kafka
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 9200:9200
    volumes:
    - es_data:/usr/share/elasticsearch/data
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      # Numeric loopback: name resolution ('localhost') intermittently hangs in
      # this environment (glibc getaddrinfo -> rtnl_dumpit), taking the healthcheck
      # down with it. The IP literal skips the resolver entirely.
      - curl -s -m 5 http://127.0.0.1:9200/ >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
    - 5601:5601
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
    - duka-net
    restart: always
    depends_on:
    - elasticsearch
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
    - 8123:8123
    - 9002:9000
    environment:
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - ./database/clickhouse:/docker-entrypoint-initdb.d
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:8123/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
    - 6379:6379
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
    - 6333:6333
    volumes:
    - qdrant_data:/qdrant/storage
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo -e "GET /health HTTP/1.0\r\n\r\n" > /dev/tcp/127.0.0.1/6333'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
  ollama-embedding:
    image: ollama/ollama:latest
    container_name: ollama-embedding
    ports:
    - 11435:11434
    volumes:
    - ollama_data:/root/.ollama
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo -e "GET /api/tags HTTP/1.0\r\n\r\n" > /dev/tcp/127.0.0.1/11434'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: serve
    environment:
    - OLLAMA_HOST=0.0.0.0:11434
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duka-api
    restart: always
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
    - 8000:8000
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf -m 5 http://127.0.0.1:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  surface-worker:
    build:
      context: .
      dockerfile: workers/surface-worker/Dockerfile
    container_name: surface-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - PROXY_POOL=socks5h://tor:9050
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      tor:
        condition: service_started
  parser-worker:
    build:
      context: .
      dockerfile: workers/parser-worker/Dockerfile
    container_name: parser-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - CLICKHOUSE_HOST=clickhouse
    - CLICKHOUSE_HTTP_PORT=8123
    - CLICKHOUSE_DB=duka_scraper
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
  deep-worker:
    build:
      context: .
      dockerfile: workers/deep-worker/Dockerfile
    container_name: deep-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - PROXY_POOL=socks5h://tor:9050
    - RESIDENTIAL_PROXY=${RESIDENTIAL_PROXY:-}
    - DISPLAY=:99
    - HEALTH_PORT=8080
    # Camoufox runs headful over the Xvfb framebuffer, i.e. a full Firefox
    # process rather than a headless shell. Firefox uses /dev/shm for its IPC
    # and Docker's 64 MB default makes its tabs crash unpredictably; give it
    # headroom so a challenge fallback is not lost to a shared-memory SIGBUS.
    shm_size: "2gb"
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      tor:
        condition: service_started
  tor:
    image: dperson/torproxy:latest
    container_name: tor
    ports:
    - 9050:9050
    networks:
    - duka-net
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - echo -e 'GET / HTTP/1.0\r\n\r\n' | timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9050' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  dark-worker:
    build:
      context: .
      dockerfile: workers/dark-worker/Dockerfile
    container_name: dark-worker
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "pip install httpx-socks socksio 'python-socks<3' -q && exec /wait_for_kafka.sh python workers/dark-worker/main.py"]
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - TOR_SOCKS5_PROXY=socks5h://tor:9050
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      tor:
        condition: service_started
  discovery-worker:
    build:
      context: .
      dockerfile: workers/discovery-worker/Dockerfile
    container_name: discovery-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - TOR_SOCKS5_PROXY=socks5h://tor:9050
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      tor:
        condition: service_started
  transcribe-worker:
    build:
      context: .
      dockerfile: workers/transcribe-worker/Dockerfile
    container_name: transcribe-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - TRANSCRIBE_ENABLED=${TRANSCRIBE_ENABLED:-true}
    - TRANSCRIBE_MODEL=${TRANSCRIBE_MODEL:-base}
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
  llm-worker:
    build:
      context: .
      dockerfile: workers/llm-worker/Dockerfile
    container_name: llm-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - LLM_PROVIDER=hosted
    - HOSTED_LLM_URL=https://api.groq.com/openai/v1/chat/completions
    - HOSTED_LLM_API_KEY=${HOSTED_LLM_API_KEY}
    - HOSTED_LLM_MODEL=openai/gpt-oss-120b
    - CH_HOST=clickhouse
    - CH_PORT=8123
    - CH_DATABASE=duka_scraper
    - RAG_ENABLED=true
    - EMBEDDING_PROVIDER=ollama
    - EMBEDDING_BASE_URL=http://ollama-embedding:11434
    # bge-m3: multilingual (Amharic + English) embeddings, 1024-dim.
    - EMBEDDING_MODEL=bge-m3
    - EMBEDDING_VECTOR_SIZE=1024
    - VECTOR_DB_URL=http://qdrant:6333
    - VECTOR_DB_COLLECTION=duka_articles
    - RAG_SCORE_THRESHOLD=0.35
    - REDIS_URL=redis://redis:6379/0
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  exporter-worker:
    build:
      context: .
      dockerfile: workers/exporter-worker/Dockerfile
    container_name: exporter-worker
    restart: unless-stopped
    environment:
    - APP_ENV=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - HEALTH_PORT=8080
    volumes:
    - .:/app
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - duka-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 4 http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Loopback-only, for the same reason as Grafana above.
    ports:
    - "127.0.0.1:9090:9090"
    command:
    # Overriding command replaces the image's own args, so --config.file has to
    # be repeated or Prometheus starts with no config and crash-loops.
    - --config.file=/etc/prometheus/prometheus.yml
    # The API proxies Prometheus at /prometheus. Without a route prefix every
    # link Prometheus renders is root-relative (/graph redirects to /query, which
    # lands outside the mount), so in-frame navigation walks straight out of the
    # embed. Kept as a bare path so the embed works on whatever origin serves the
    # UI - the Vite dev server in development, the API in production.
    - --web.external-url=/prometheus
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./monitoring/alerts:/etc/prometheus/rules
    networks:
    - duka-net
    restart: always
    depends_on:
    - alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
    - 9093:9093
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    environment:
    - PAGERDUTY_SERVICE_KEY=${PAGERDUTY_SERVICE_KEY:-}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    networks:
    - duka-net
    restart: always
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Loopback-only. The UI embeds Grafana through the API's /grafana proxy
    # mount, which strips the X-Frame-Options header that blocks framing in
    # Grafana >= 13.
    ports:
    - "127.0.0.1:3000:3000"
    volumes:
    - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    # Allow the dashboard to be embedded in the UI's Monitoring page iframe.
    - GF_ALLOW_EMBEDDING=true
    # The API proxies Grafana at /grafana. Telling Grafana its own sub-path makes
    # it generate /grafana-prefixed asset, API and websocket URLs instead of
    # root-relative ones - without this its router 404s inside the iframe.
    - GF_SERVER_SERVE_FROM_SUB_PATH=true
    - GF_SERVER_ROOT_URL=/grafana
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    - GF_AUTH_BASIC_ENABLED=false
    networks:
    - duka-net
    restart: always
    depends_on:
    - prometheus