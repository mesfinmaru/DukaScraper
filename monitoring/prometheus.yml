global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- API ---
  - job_name: duka-api
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics

  # --- Workers ---
  - job_name: duka-workers
    static_configs:
      - targets:
          - surface-worker:8081
          - parser-worker:8081
          - deep-worker:8081
          - dark-worker:8081
          - llm-worker:8081
          - exporter-worker:8081
    metrics_path: /metrics

  # --- Prometheus self-monitoring ---
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090